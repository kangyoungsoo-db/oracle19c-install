---
- name: listener.ora · sqlnet.ora · tnsnames.ora
  ansible.builtin.template:
    src: "templates/{{ item }}.j2"
    dest: "{{ oracle_home }}/network/admin/{{ item }}"
    owner: oracle
    group: oinstall
    mode: "0644"
  loop: [listener.ora, sqlnet.ora, tnsnames.ora]

- name: 리스너 시작 (이미 떠 있으면 그대로)
  ansible.builtin.shell: lsnrctl status >/dev/null 2>&1 && echo RUNNING || { lsnrctl start && echo CHANGED; }
  environment: "{{ ora_env }}"
  become: true
  become_user: oracle
  register: lsnr
  changed_when: "'CHANGED' in lsnr.stdout"
